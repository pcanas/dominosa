# Checks every push to main and every pull request; pushes to main also deploy
# the web prototype to GitHub Pages (Settings → Pages → Source: "GitHub Actions").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPO_NO_TELEMETRY: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Includes the level guard: every bundled level must have exactly one solution.
      - run: npm test

  # Main is always what is live: publish it once the checks pass. The same
  # workflow can publish any branch or commit by hand (see deploy.yml).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      label: main
      skip_checks: true
